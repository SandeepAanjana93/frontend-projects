<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="infoform">
        <label>Name:-</label>
        <input type="text" id="input1" placeholder="Enter full name"><br><br>
        <label>age:-</label>
        <input type="number" id="input2" placeholder="Enter age"><br><br>
        <label>email:-</label>
        <input type="email" id="input3" placeholder="Enter email"><br><br>
        <label>password:-</label>
        <input type="password" id="input4" placeholder="Enter password"><br><br>
        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById("infoform").addEventListener("submit", function(event){
            let one = document.getElementById("input1").value
            let two = document.getElementById("input2").value
            let three = document.getElementById("input3").value
            let four = document.getElementById("input4").value
            if(one === ""){
                alert("name must be fill");
                event.preventDefault();
            }
            if(two === ""){
                alert("age must be fill");
                event.preventDefault();
            }
            if(two < 17 && two > 100){
                alert("age must be greater 17");
                event.preventDefault();
            }
            if(!three === ""){
                alert("email must be fill");
                event.preventDefault();
            }
            if(!three.includes("@")){
                alert("enter a valid email");
                event.preventDefault();
            }
            if(four === ""){
                alert("password must be fill")
                event.preventDefault();
            }
            if(four.length < 8 && four.lebgth > 16){
                alert("password must be 8 character")
                event.preventDefault();
            }
        })
    </script>
</body>
</html>
