<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>greeting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dark-mode {
            background-color: #121212;
            color: white;
        }

        .dark-mode footer {
            background-color: #000 !important;
        }

        .dark-mode .card {
            border: 1px solid #555;
        }
    </style>
</head>

<body class="bg-light">

    <header
        class="bg-primary text-white text-center py-4 shadow btn-dark d-flex justify-content-between align-items-center">
        <h2 class="mb-0">Sandeep Patel</h2>
        <button id="btn-dark">🌙 Dark Mode</button>
    </header>
    <main class="container text-center my-5">
        <div class="card shadow-lg p-5">
            <h1 class="display-5">Welcome To</h1>
            <h2 class="text-primary">Website</h2>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 fixed-bottom">
        <p class="mb-0">© All sites are reserved</p>
    </footer>

    <script>
        let button = document.getElementById("btn-dark").addEventListener("click", function () {
            document.body.classList.toggle("dark-mode");
            if (document.body.classList.contains("dark-mode")) {
                button.innerText = "☀️ Light Mode";
                document.body.classList.remove("bg-light");
                document.querySelector(".card").style.backgroundColor = "#333";
                document.querySelector(".card").style.color = "white";
                localStorage.setItem("theme", "dark");
            } else {
                button.innerText = "🌙 Dark Mode";
                document.body.classList.add("bg-light");
                document.querySelector(".card").style.backgroundColor = "white";
                document.querySelector(".card").style.color = "black";
                localStorage.setItem("theme", "light");
            }            
        });
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            document.body.classList.remove("bg-light");
            document.querySelector(".card").style.backgroundColor = "#333";
            document.querySelector(".card").style.color = "white";
            button.innerText = "☀️ Light Mode";
        }
    </script>


</body>

</html>
